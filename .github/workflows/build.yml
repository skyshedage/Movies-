name: Reproducible checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: springapp/pom.xml
      - run: mvn -B -f springapp/pom.xml test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angularapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: angularapp/package-lock.json
      - run: npm ci
      - run: npm run build
