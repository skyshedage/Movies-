<nav class="navbar">
  <div class="navbar-container">
      <h1 class="site-title">Book MyShow</h1>
      <ul class="nav-links">
          <ng-container *ngIf="!isLoggedIn">
              <li><a routerLink="/register">Register</a></li>
              <li><a routerLink="/login">Login</a></li>
          </ng-container>
          <ng-container *ngIf="isLoggedIn">
              <li>
                  <span class="user-info">
                      ({{username}})-({{userRole}})
                  </span>
              </li>
              <li ><a routerLink="/">Home</a></li>
              <ng-container *ngIf="userRole === 'ADMIN'">
                  <li><a routerLink="/admin/add/newMovies">Add Movies</a></li><li><a routerLink="/admin/view/Movies">View Movies</a></li><li><a routerLink="/admin/view/AllBookings">View Bookings</a></li>
              </ng-container>
              <ng-container *ngIf="userRole === 'USER'">
                  <li><a routerLink="/user/view/Movies">View Movies</a></li><li><a routerLink="/user/view/Mybookings">View Bookings</a></li>
              </ng-container>
              <li>
                  <button (click)="showLogoutPopup = true" class="logout-btn">
                  Logout
                  </button>
              </li>
          </ng-container>
      </ul>
  </div>

  <div *ngIf="showLogoutPopup" class="logout-popup">
      <div class="popup-content">
          <h3>Confirm Logout</h3>
          <p>Are you sure you want to logout.</p>
          <div class="popup-actions">
              <button (click)="logout()" class="confirm-btn">Yes, Logout</button>
              <button (click)="showLogoutPopup = false" class="cancel-btn">Cancel</button>
          </div>
      </div>
  </div>
</nav>
